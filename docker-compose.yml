# =============================================================================
# Infraestructura local de desarrollo.
# Levantar:   pnpm db:up   (o) docker compose up -d
# En producción se sustituye por servicios gestionados (RDS/ElastiCache) —
# ver context/05-devops-cicd.md
# =============================================================================
services:
  postgres:
    image: postgres:17-alpine
    container_name: cobradiario_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cobradiario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cobradiario_dev_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-cobradiario}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cobradiario} -d ${POSTGRES_DB:-cobradiario}"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"

  redis:
    image: redis:7-alpine
    container_name: cobradiario_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./.volumes/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
