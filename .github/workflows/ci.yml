name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cobradiario
          POSTGRES_PASSWORD: cobradiario_dev_pwd
          POSTGRES_DB: cobradiario
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cobradiario"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://cobradiario:cobradiario_dev_pwd@localhost:5432/cobradiario?schema=public
      DIRECT_URL: postgresql://cobradiario:cobradiario_dev_pwd@localhost:5432/cobradiario?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @cobradiario/api prisma:generate

      - name: Build shared packages
        run: pnpm --filter @cobradiario/credit-engine build

      - name: Unit tests (credit-engine)
        run: pnpm --filter @cobradiario/credit-engine test

      # Aplica el schema + RLS (crea el rol app_user y las políticas).
      - name: DB migrate
        run: pnpm --filter @cobradiario/api exec prisma migrate deploy

      - name: Typecheck
        run: |
          pnpm --filter @cobradiario/api typecheck
          pnpm --filter @cobradiario/web typecheck

      - name: E2E tests (backend + Postgres/RLS)
        run: pnpm --filter @cobradiario/api test:e2e

      - name: Build
        run: |
          pnpm --filter @cobradiario/api build
          pnpm --filter @cobradiario/web build
